name: Publish to Figma store

on:
  push:
    branches: [ "production" ]

env:
  ENVIRONMENT: ${{ vars.ENVIRONMENT }}
  SENTRY_ORG: ${{ vars.SENTRY_ORG }}
  SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
  FIGMA_TEXT_FILE: ${{ vars.FIGMA_TEXT_FILE }}
  SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
  SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
  FIGMA_WEB_AUTHN: ${{ secrets.FIGMA_WEB_AUTHN }}


jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Use Node.js 18.x
      uses: actions/setup-node@v3
    
    - name: Install dependencies
      run: | 
        npm install

    - name: Set next Figma version as minor version in package.js
      run: | 
        npx figcd prepare
      
    - name: Build plugin and publish to Sentry (part of webpack)
      run: |
        npm run build
          
    - name: Publish new Version to Figma
      run: | 
        npx figcd release --release-notes changelog-{{VERSION}}.txt

    - name: Upload a Build Artifact
      uses: actions/upload-artifact@v3.1.2
      with:
        # Artifact name
        name: Figma plugin
        # A file, directory or wildcard pattern that describes what to upload
        path: |
          ./dist/*          
          ./manifest.json
        # The desired behavior if no files are found using the provided path.
   
        retention-days: 90
