name: Release build

# Builds the files of a Parrot release. Publishing to the Figma Community stays a manual step in the
# Figma desktop app (Plugins > Manage plugins > Publish new version) with the manifest of this build.
on:
  workflow_dispatch:
    inputs:
      ui_url:
        description: "URL where dist/ui is hosted (the plugin sandbox loads the UI from there; its origin must be in manifest.json networkAccess.allowedDomains)"
        required: true
      plugin_name:
        description: "Plugin name written into the released manifest"
        required: true
        default: "Parrot - Language Translation with ease - the Translator, i18n, l8n, Plugin (Free Beta)"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck, lint and test
        run: pnpm tsc && pnpm lint && pnpm test

      - name: Build UI
        run: pnpm build

      - name: Build plugin sandbox
        run: pnpm exec vite build --config vite.config.plugin.ts
        env:
          VITE_CUSTOM_URL: ${{ inputs.ui_url }}

      - name: Release manifest
        run: |
          node -e '
            const fs = require("fs");
            const manifest = JSON.parse(fs.readFileSync("manifest.json", "utf8"));
            const origin = new URL(process.env.UI_URL).origin;
            if (!manifest.networkAccess.allowedDomains.includes(origin))
              throw new Error(`${origin} is not in networkAccess.allowedDomains of manifest.json`);
            manifest.name = process.env.PLUGIN_NAME;
            fs.mkdirSync("release/dist", { recursive: true });
            fs.writeFileSync("release/manifest.json", JSON.stringify(manifest, null, 2));
          '
          cp dist/plugin.js release/dist/plugin.js
          cp -r dist/ui release/dist/ui
        env:
          UI_URL: ${{ inputs.ui_url }}
          PLUGIN_NAME: ${{ inputs.plugin_name }}

      - uses: actions/upload-artifact@v4
        with:
          name: parrot-figma-plugin
          path: release/
          retention-days: 90
