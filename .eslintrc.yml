
extends:
- airbnb
- airbnb-typescript
parserOptions:
  project:
  - tsconfig.json
globals:
  figma: 'readable'
  __html__: 'readable'
rules:
  no-restricted-syntax:
  - error
  - ForInStatement
  - LabeledStatement
  - WithStatement
  no-await-in-loop: 'off'
  jsx-a11y: 'off'
  max-len: 'off'
  react/require-default-props: 'off'
