name: Release build

# Builds the files of a Parrot release. Publishing to the Figma Community stays a manual step in the
# Figma desktop app (Plugins > Manage plugins > Publish new version) with the manifest of this build.
on:
  workflow_dispatch:
    inputs:
      ui_url:
        description: "URL where dist/ui is hosted (the plugin sandbox loads the UI from there)"
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build UI
        run: pnpm build

      - name: Build plugin sandbox
        run: pnpm exec vite build --config vite.config.plugin.ts
        env:
          VITE_CUSTOM_URL: ${{ inputs.ui_url }}

      - uses: actions/upload-artifact@v4
        with:
          name: parrot-figma-plugin
          path: |
            dist/
            manifest.json
          retention-days: 90
